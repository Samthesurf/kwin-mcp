name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build distributions
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Publish to PyPI is intentionally opt-in: set the repository VARIABLE
  # ENABLE_PYPI to 'true' AND add a trusted-publisher / PYPI_TOKEN secret to
  # turn the publish step on. Out of the box this workflow only builds and
  # archives the artifacts, so it is safe to enable on your fork immediately.
  publish:
    name: Publish to PyPI
    needs: build
    if: vars.ENABLE_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
