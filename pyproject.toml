[project]
name = "kwin-mcp-server"
version = "0.4.0"
description = "MCP server that controls native Wayland windows on KDE Plasma (the cua-driver X11 gap, solved). Includes a doctor readiness report, semantic AT-SPI targeting, and an MCP safety contract."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "computer-use", "kde", "plasma", "wayland", "accessibility", "at-spi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "mcp>=1.0,<2.0",
    "python-uinput>=1.0.1",
    "Pillow>=10.0.0",
    "jeepney>=0.8.0",
    "cryptography>=42.0.0",   # AES-256-GCM at rest for Computer History
]

[project.optional-dependencies]
# AT-SPI targeting works out of the box via the pure-D-Bus backend (jeepney).
# The legacy pyatspi backend is used only if the pyatspi module is present.
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Samthesurf/kwin-mcp"
Repository = "https://github.com/Samthesurf/kwin-mcp"
Issues = "https://github.com/Samthesurf/kwin-mcp/issues"

[project.scripts]
kwin-mcp = "kwin_bridge.server:main"
kwin-mcp-setup = "kwin_bridge.setup:main"
kwin-mcp-doctor = "kwin_bridge.doctor:main"
kwin-mcp-preflight = "kwin_bridge.preflight:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kwin_bridge"]
